<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link href="./output.css" rel="stylesheet" />
    <link href="./styles.css" rel="stylesheet" />
    <style>
      .detail-loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        z-index: 50;
      }
      .detail-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(161, 161, 170, 0.25);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: detail-spinner-spin 0.7s linear infinite;
      }
      html.dark .detail-spinner {
        border-color: rgba(113, 113, 122, 0.35);
        border-top-color: #fbbf24;
      }
      @keyframes detail-spinner-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-white dark-mode-transition">
    <div id="detailLoadingOverlay" class="detail-loading-overlay">
      <div class="detail-spinner"></div>
    </div>
    <!-- Minimal top bar — no full site nav on this page -->
    <div
      class="detail-topbar flex items-center justify-between px-4 md:px-6 lg:px-10 py-4"
    >
      <a
        href="./index.html"
        class="detail-back-link inline-flex items-center gap-1.5 text-sm font-medium"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M9.5 12.5 5 8l4.5-4.5"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Back to Movies
      </a>

      <button
        onclick="toggleTheme()"
        aria-label="Toggle dark mode"
        class="theme-toggle-btn w-9 h-9 shrink-0 rounded-full bg-zinc-50 border border-zinc-200 flex items-center justify-center cursor-pointer"
      >
        <svg
          class="theme-icon-moon"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M14 9.187A6.333 6.333 0 1 1 6.813 2 5 5 0 0 0 14 9.187"
            stroke="#27272a"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
        <svg
          class="theme-icon-sun hidden"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle
            cx="8"
            cy="8"
            r="3"
            stroke="#27272a"
            stroke-width="1.3"
          ></circle>
          <path
            d="M8 1.5v1.4M8 13.1v1.4M14.5 8h-1.4M2.9 8H1.5M12.6 3.4l-1 1M4.4 11.6l-1 1M12.6 12.6l-1-1M4.4 4.4l-1-1"
            stroke="#27272a"
            stroke-width="1.3"
            stroke-linecap="round"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Mobile-only tab bar -->
    <div
      id="detailTabs"
      class="lg:hidden detail-tabs flex items-center gap-5 px-4 md:px-6 overflow-x-auto border-b"
    >
      <button type="button" data-panel="overview" class="detail-tab is-active">
        Overview
      </button>
      <button type="button" data-panel="cast" class="detail-tab">Cast</button>
      <button type="button" data-panel="crew" class="detail-tab">Crew</button>
      <button type="button" data-panel="reviews" class="detail-tab">
        Reviews
      </button>
    </div>

    <main
      id="detailMain"
      class="hidden px-4 md:px-6 lg:px-10 py-6 lg:py-8 max-w-[1200px] mx-auto flex flex-col gap-5"
    >
      <!-- ============ MOBILE: Overview panel ============ -->
      <section data-panel="overview" class="detail-panel lg:hidden">
        <!-- Title + meta -->
        <div class="mt-5 flex items-start justify-between gap-3">
          <div>
            <h1 class="detail-title text-2xl font-bold"></h1>
            <p class="detail-meta mt-1 text-sm"></p>
          </div>
        </div>

        <div class="mt-3 flex flex-wrap gap-2 genre-pills-container"></div>

        <div class="mt-4 flex flex-wrap gap-3">
          <button type="button" class="detail-btn-primary watch-trailer-btn">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M4.5 3.2v9.6c0 .6.66.97 1.18.66l7.8-4.8a.77.77 0 0 0 0-1.32l-7.8-4.8A.77.77 0 0 0 4.5 3.2z"
              />
            </svg>
            Watch Trailer
          </button>
          <button type="button" class="detail-btn-secondary">
            <svg
              width="13"
              height="13"
              viewBox="0 0 16 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8 3.5v9M3.5 8h9"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            Add to Favorites
          </button>
        </div>

        <p class="detail-overview mt-5 text-sm leading-relaxed"></p>

        <div class="detail-divider my-5"></div>

        <div class="space-y-2.5 text-sm">
          <div class="flex gap-2">
            <span class="detail-label w-20 shrink-0">Director</span>
            <span class="detail-value director-value"></span>
          </div>
          <div class="flex gap-2">
            <span class="detail-label w-20 shrink-0">Writers</span>
            <span class="detail-value writers-value"></span>
          </div>
          <div class="flex gap-2">
            <span class="detail-label w-20 shrink-0">Stars</span>
            <span class="detail-value stars-value"></span>
          </div>
        </div>

        <!-- Info stat bar -->
        <div class="info-stat-bar mt-5 grid grid-cols-2 gap-4 rounded-2xl p-4">
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
        </div>

        <!-- Reviews preview -->
        <div class="mt-7">
          <div class="flex items-center justify-between">
            <h2 class="detail-section-title text-base font-bold">Reviews</h2>
            <button
              type="button"
              data-jump="reviews"
              class="view-all-link text-sm font-medium"
            >
              View all
            </button>
          </div>

          <div class="mt-3 grid grid-cols-2 gap-3">
            <div class="review-score-card">
              <p
                class="flex items-center gap-1 text-lg font-bold text-amber-400"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    d="M10 1.5l2.63 5.33 5.87.85-4.25 4.15 1 5.85L10 14.9l-5.25 2.78 1-5.85L1.5 7.68l5.87-.85z"
                  />
                </svg>
                <span class="rating-value"></span
                ><span class="text-xs font-medium text-zinc-400">/10</span>
              </p>
              <p class="review-score-label">TMDb Rating</p>
            </div>
            <div class="review-score-card">
              <p class="text-lg font-bold vote-count-value"></p>
              <p class="review-score-label">Votes</p>
            </div>
          </div>

          <div class="mt-3 space-y-3" id="mobileReviewsPreview"></div>
        </div>
      </section>

      <!-- ============ MOBILE: Cast panel ============ -->
      <section data-panel="cast" class="detail-panel lg:hidden hidden">
        <h2 class="detail-section-title text-base font-bold mb-3">Cast</h2>
        <div class="grid grid-cols-3 gap-4" id="mobileCastGrid"></div>
      </section>

      <!-- ============ MOBILE: Crew panel ============ -->
      <section data-panel="crew" class="detail-panel lg:hidden hidden">
        <h2 class="detail-section-title text-base font-bold mb-3">Crew</h2>
        <div class="space-y-3" id="mobileCrewList"></div>
      </section>

      <!-- ============ MOBILE: Reviews panel ============ -->
      <section data-panel="reviews" class="detail-panel lg:hidden hidden">
        <h2 class="detail-section-title text-base font-bold mb-3">Reviews</h2>
        <div id="mobileCommentsSection"></div>
      </section>

      <!-- ================= DESKTOP LAYOUT: Hero + info ================= -->
      <div class="hidden lg:block lg:order-1">
        <!-- Hero: poster + details -->
        <div class="grid grid-cols-[300px_1fr] gap-8">
          <img class="detail-poster w-full rounded-2xl object-cover" />

          <div>
            <div class="flex items-start justify-between gap-4">
              <div>
                <h1 class="detail-title text-3xl font-bold"></h1>
                <p class="detail-meta mt-1.5 text-sm"></p>
                <div
                  class="mt-3 flex flex-wrap gap-2 genre-pills-container"
                ></div>
              </div>
            </div>

            <div class="mt-5 flex flex-wrap gap-3">
              <button
                type="button"
                class="detail-btn-primary watch-trailer-btn"
              >
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 16 16"
                  fill="currentColor"
                >
                  <path
                    d="M4.5 3.2v9.6c0 .6.66.97 1.18.66l7.8-4.8a.77.77 0 0 0 0-1.32l-7.8-4.8A.77.77 0 0 0 4.5 3.2z"
                  />
                </svg>
                Watch Trailer
              </button>
              <button type="button" class="detail-btn-secondary">
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 16 16"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M8 3.5v9M3.5 8h9"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
                Add to Favorites
              </button>
            </div>

            <p
              class="detail-overview mt-5 text-sm leading-relaxed max-w-2xl"
            ></p>

            <div class="detail-divider my-5"></div>

            <div class="space-y-2.5 text-sm">
              <div class="flex gap-2">
                <span class="detail-label w-20 shrink-0">Director</span>
                <span class="detail-value director-value"></span>
              </div>
              <div class="flex gap-2">
                <span class="detail-label w-20 shrink-0">Writers</span>
                <span class="detail-value writers-value"></span>
              </div>
              <div class="flex gap-2">
                <span class="detail-label w-20 shrink-0">Stars</span>
                <span class="detail-value stars-value"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Info stat bar -->
        <div class="info-stat-bar mt-6 grid grid-cols-4 gap-6 rounded-2xl p-5">
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
          <div>
            <p class="info-stat-label"></p>
            <p class="info-stat-value"></p>
          </div>
        </div>
      </div>

      <!-- ============ SHARED: Trailer (one node, repositioned via
           CSS order instead of duplicated per breakpoint) ============ -->
      <div class="order-first lg:order-2 mt-5 lg:mt-8">
        <h2
          class="detail-section-title text-base lg:text-lg font-bold mb-3 lg:mb-4"
        >
          Trailer
        </h2>
        <div
          id="trailerSection"
          class="trailer-embed relative w-full lg:max-w-3xl overflow-hidden rounded-2xl"
        >
          <img class="w-full h-full object-cover" />
          <div class="trailer-embed-scrim absolute inset-0"></div>
          <p
            class="trailer-embed-label absolute left-4 lg:left-5 bottom-4 lg:bottom-5 text-sm lg:text-base font-semibold text-white"
          ></p>
          <button
            type="button"
            class="trailer-play-btn trailer-play-trigger absolute inset-0 m-auto w-14 h-14 lg:w-16 lg:h-16 rounded-full flex items-center justify-center"
            aria-label="Play trailer"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="lg:w-[22px] lg:h-[22px]"
            >
              <path
                d="M4.5 3.2v9.6c0 .6.66.97 1.18.66l7.8-4.8a.77.77 0 0 0 0-1.32l-7.8-4.8A.77.77 0 0 0 4.5 3.2z"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- ================= DESKTOP LAYOUT: Cast + Reviews ================= -->
      <div class="hidden lg:block lg:order-3">
        <div class="mt-8">
          <div>
            <div class="flex items-center justify-between">
              <h2 class="detail-section-title text-lg font-bold">Cast</h2>
            </div>
            <div
              class="mt-4 grid grid-cols-3 sm:grid-cols-6 gap-5"
              id="desktopCastGrid"
            ></div>
          </div>
        </div>

        <!-- Reviews -->
        <div class="mt-10">
          <div class="flex items-center justify-between">
            <h2 class="detail-section-title text-lg font-bold">Reviews</h2>
          </div>

          <div class="mt-4 flex gap-4">
            <div class="review-score-card w-48">
              <p
                class="flex items-center gap-1 text-2xl font-bold text-amber-400"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    d="M10 1.5l2.63 5.33 5.87.85-4.25 4.15 1 5.85L10 14.9l-5.25 2.78 1-5.85L1.5 7.68l5.87-.85z"
                  />
                </svg>
                <span class="rating-value"></span
                ><span class="text-sm font-medium text-zinc-400">/10</span>
              </p>
              <p class="review-score-label">TMDb Rating</p>
            </div>
            <div class="review-score-card w-48">
              <p class="text-2xl font-bold vote-count-value"></p>
              <p class="review-score-label">Votes</p>
            </div>
          </div>

          <div id="desktopCommentsSection" class="mt-8"></div>
        </div>
      </div>
    </main>

    <script>
      // Theme toggle — same logic used across the site.
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();

      function syncThemeIcons() {
        const isDark = document.documentElement.classList.contains("dark");
        document.querySelectorAll(".theme-icon-moon").forEach((el) => {
          el.classList.toggle("hidden", isDark);
        });
        document.querySelectorAll(".theme-icon-sun").forEach((el) => {
          el.classList.toggle("hidden", !isDark);
        });
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        syncThemeIcons();
      }

      syncThemeIcons();

      // Mobile tab switching — everything stays on this one page, tabs
      // just show/hide the matching panel. Desktop ignores all of this
      // and shows the full stacked layout instead (see the "hidden
      // lg:block" wrapper).
      const tabsWrap = document.getElementById("detailTabs");
      if (tabsWrap) {
        tabsWrap.querySelectorAll(".detail-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            tabsWrap
              .querySelectorAll(".detail-tab")
              .forEach((t) => t.classList.remove("is-active"));
            tab.classList.add("is-active");

            document.querySelectorAll(".detail-panel").forEach((panel) => {
              panel.classList.toggle(
                "hidden",
                panel.dataset.panel !== tab.dataset.panel,
              );
            });
          });
        });
      }

      // "View all" inside the mobile Reviews preview jumps to the
      // Reviews tab instead of just linking off-page.
      document.querySelectorAll("[data-jump]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.dataset.jump;
          const tabBtn = tabsWrap.querySelector(`[data-panel="${target}"]`);
          if (tabBtn) tabBtn.click();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    </script>

    <script src="./movies.js" type="module"></script>
    <script src="./movieDetail.js" type="module"></script>
  </body>
</html>
